# Generated by forge. GoReleaser config for meibel.
version: 2

project_name: meibel

before:
  hooks:
    - go mod tidy

builds:
  - binary: meibel
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/meibel-ai/meibel-cli/internal/version.Version={{.Version}} -X github.com/meibel-ai/meibel-cli/internal/version.Commit={{.Commit}} -X github.com/meibel-ai/meibel-cli/internal/version.BuildDate={{.Date}}

archives:
  - formats: ["tar.gz"]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

homebrew_casks:
  - name: meibel
    repository:
      owner: meibel-ai
      name: homebrew-tap
      git:
        url: "ssh://git@github.com/meibel-ai/homebrew-tap.git"
        private_key: "{{ .Env.HOMEBREW_TAP_DEPLOY_KEY }}"
        ssh_command: "ssh -i {{ .Env.HOMEBREW_TAP_DEPLOY_KEY }} -o StrictHostKeyChecking=accept-new -F /dev/null"
    homepage: https://github.com/meibel-ai/meibel-cli
    description: CLI for the meibel-ai-api API
    license: MIT
    binaries:
      - meibel
    hooks:
      pre:
        install: |
          system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/meibel"]
    generate_completions_from_executable:
      executable: meibel
      args: ["completion"]
      shells: ["bash", "zsh", "fish"]
